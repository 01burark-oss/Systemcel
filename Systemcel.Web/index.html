<!doctype html>
<html lang="tr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Systemcel ile ön muhasebe, nakit akışı, yapay zekâ destekli finans ve muhasebeci iş birliğini tek yerde yönetin." />
    <meta name="theme-color" content="#d7ff3f" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Systemcel — İşletmenizin finansal işletim sistemi" />
    <meta property="og:description" content="Ön muhasebe, nakit akışı ve muhasebeci iş birliği tek platformda." />
    <meta property="og:image" content="/systemcel-social-preview.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/systemcel-social-preview.png" />
    <title>Systemcel — Ön Muhasebe ve Nakit Akışı</title>
    <script>
      try {
        const savedTheme = window.localStorage.getItem("systemcel.theme");
        const theme = savedTheme === "light" || savedTheme === "dark"
          ? savedTheme
          : window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]')?.setAttribute("content", theme === "dark" ? "#11120e" : "#f2f0e7");
      } catch {
        document.documentElement.dataset.theme = "light";
      }

      if (/^\/(sign-in|sign-up)(?:\/|$)/.test(window.location.pathname)) {
        document.documentElement.dataset.authRoute = "true";
      }
    </script>
    <style>
      html[data-auth-route="true"],
      html[data-auth-route="true"] body,
      html[data-auth-route="true"] #root {
        background: #f5f3ea;
      }

      html:not([data-auth-route="true"]),
      html:not([data-auth-route="true"]) body,
      html:not([data-auth-route="true"]) #root {
        background: #f2f0e7;
      }

      html[data-theme="dark"],
      html[data-theme="dark"] body,
      html[data-theme="dark"] #root {
        background: #11120e;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
