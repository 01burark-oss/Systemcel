name: systemcel

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - private

  app:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        VITE_ACCOUNTANT_MARKETPLACE_ENABLED: ${VITE_ACCOUNTANT_MARKETPLACE_ENABLED:-false}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ASPNETCORE_URLS: http://+:8080
      HOME: /var/lib/systemcel
      SYSTEMCEL_APPDATA: /var/lib/systemcel
      SYSTEMCEL_DATABASE_CONNECTION_STRING: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - app_data:/var/lib/systemcel
    networks:
      - edge
      - private
    logging:
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS}
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
    logging:
      options:
        max-size: "10m"
        max-file: "5"

networks:
  edge:
  private:
    internal: true

volumes:
  postgres_data:
  app_data:
  caddy_data:
  caddy_config:
