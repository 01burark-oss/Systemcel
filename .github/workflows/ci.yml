name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Systemcel.Web/package-lock.json

      - name: Build Systemcel.Web
        working-directory: Systemcel.Web
        shell: pwsh
        run: |
          npm ci
          npm run build

      - name: Restore
        shell: pwsh
        run: dotnet restore .\CashTracker.sln /p:Configuration=Release /p:RestoreUseStaticGraphEvaluation=true

      - name: Audit npm dependencies
        working-directory: Systemcel.Web
        shell: pwsh
        run: npm audit --audit-level=high

      - name: Audit .NET dependencies
        shell: pwsh
        run: |
          $audit = dotnet list .\CashTracker.sln package --vulnerable --include-transitive
          $audit | Write-Output
          if ($audit -match "has the following vulnerable packages") {
            throw "High-confidence vulnerable NuGet dependency detected."
          }

      - name: Build
        shell: pwsh
        run: dotnet build .\CashTracker.sln --no-restore --configuration Release --disable-parallel /p:BuildInParallel=false

      - name: Test
        shell: pwsh
        run: dotnet test .\CashTracker.Tests\CashTracker.Tests.csproj --no-build --configuration Release --logger "console;verbosity=minimal"

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan committed history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
